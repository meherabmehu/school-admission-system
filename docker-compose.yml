services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: admission
      POSTGRES_PASSWORD: admission
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission -d school_admission"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
