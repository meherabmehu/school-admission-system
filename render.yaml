services:
  - type: web
    name: school-admission-api
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: off
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: HOLD_DURATION_SECONDS
        value: "600"
      - key: EXPIRY_SWEEP_INTERVAL_SECONDS
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: school-admission-db
          property: connectionString

  - type: web
    name: school-admission-frontend
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: off
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: API_BASE_URL
        fromService:
          name: school-admission-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: school-admission-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: school_admission
    user: admission
    ipAllowList: []
